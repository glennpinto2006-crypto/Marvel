<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARVEL CINEMATIC UNIVERSE — Heroes Archive</title>
  <meta name="description" content="Explore Earth's Mightiest Heroes in the Marvel Cinematic Universe. Immersive 3D experience featuring Iron Man, Spider-Man, Thor, Hulk, Captain America, Doctor Strange, and Wolverine."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --canvas: #080808;
      --surface-1: #0D0D0D;
      --surface-2: #151515;
      --hairline: #242424;
      --hairline-bright: #2A2A2A;
      --text-dominant: #FFFFFF;
      --text-secondary: #D0D0D0;
      --text-muted: #8A8A8A;
      --crimson: #E62429;
      --crimson-hover: #FF3439;
      --gold: #F5C518;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Manrope', sans-serif;
      --font-mono: 'Space Grotesk', monospace;
      --theme-primary: #E62429;
      --theme-secondary: #38bdf8;
      --theme-glow: rgba(230, 36, 41, 0.4);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #333 var(--canvas); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--canvas); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--theme-primary); }
    body { font-family: var(--font-body); background: var(--canvas); color: var(--text-secondary); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--crimson); color: white; }

    /* ═══ THREE.JS CANVAS ═══ */
    #three-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ═══ DYNAMIC BACKGROUND LAYERS ═══ */
    .bg-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .bg-image-layer {
      position: fixed; inset: 0; z-index: 1;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .bg-image-layer.active { opacity: 1; }
    .bg-image-mask {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(8,8,8,0.6) 55%, rgba(8,8,8,0.92) 80%);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bg-gradient-layer {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      transition: background 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bg-gradient-layer.captain-shield-rings {
      background-image: 
        radial-gradient(circle at 50% 48%, transparent 160px, rgba(59, 130, 246, 0.12) 161px, transparent 164px),
        radial-gradient(circle at 50% 48%, transparent 290px, rgba(59, 130, 246, 0.09) 291px, transparent 294px),
        radial-gradient(circle at 50% 48%, transparent 420px, rgba(59, 130, 246, 0.07) 421px, transparent 425px),
        radial-gradient(circle at 50% 48%, transparent 560px, rgba(37, 99, 235, 0.05) 561px, transparent 565px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 64px 64px, 64px 64px;
    }
    .bg-darkening {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      background: linear-gradient(to top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.3) 40%, rgba(8,8,8,0.5) 100%);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Ambient Orbs */
    .ambient-orb {
      position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 3;
      transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #ambOrb1 { width: 700px; height: 700px; top: 15%; left: 55%; transform: translate(-50%,-50%); background: var(--theme-glow); }
    #ambOrb2 { width: 500px; height: 500px; top: 65%; left: 25%; transform: translate(-50%,-50%); }
    #ambOrb3 { width: 350px; height: 350px; top: 35%; left: 10%; transform: translate(-50%,-50%); background: rgba(245,197,24,0.04); }

    /* ═══ NAVIGATION ═══ */
    .nav-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 3rem; height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(8,8,8,0.6); backdrop-filter: blur(20px) saturate(1.5);
      transition: all 0.3s ease;
    }
    .nav-header.scrolled { background: rgba(8,8,8,0.92); border-bottom-color: var(--hairline); }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
    .nav-logo-icon {
      width: 40px; height: 40px; border: 2px solid var(--theme-primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(230,36,41,0.1); box-shadow: 0 0 20px var(--theme-glow);
      transition: all 0.5s ease;
    }
    .nav-logo-icon svg { width: 20px; height: 20px; fill: var(--theme-primary); transition: fill 0.5s ease; }
    .nav-brand { display: flex; flex-direction: column; }
    .nav-brand-title { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: white; }
    .nav-brand-sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 40px; list-style: none; }
    .nav-links a {
      font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-muted); text-decoration: none;
      position: relative; padding-bottom: 4px; transition: color 0.3s ease;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px;
      background: var(--theme-primary); transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .nav-links a:hover, .nav-links a.active { color: white; }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-hashtag {
      font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
      color: var(--gold); text-shadow: 0 0 12px rgba(245,197,24,0.4); transition: all 0.5s ease;
    }
    .nav-audio-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease;
    }
    .nav-audio-btn:hover { background: rgba(255,255,255,0.1); color: white; }

    /* ═══ HERO SECTION ═══ */
    .hero-section {
      position: relative; z-index: 10; min-height: 100vh;
      display: flex; align-items: center; padding: 76px 3rem 80px;
    }
    .hero-container {
      width: 100%; max-width: 1440px; margin: 0 auto;
      display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: center; padding: 8px 0;
    }
    /* Hero Content */
    .hero-content { position: relative; z-index: 5; perspective: 1000px; }
    .hero-badge-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .badge-marvel {
      background: var(--crimson); color: white; font-family: var(--font-mono);
      font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 2px;
    }
    .badge-earth { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--text-secondary); text-transform: uppercase; }
    .hero-title {
      font-family: var(--font-display); font-size: clamp(48px, 6.2vw, 84px); font-weight: 400;
      line-height: 0.92; letter-spacing: 0.05em; text-transform: uppercase; color: white;
      margin-bottom: 12px; text-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 30px var(--theme-glow);
      transition: text-shadow 0.8s ease;
    }
    .hero-identity-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .hero-real-name {
      font-family: var(--font-body); font-size: 16px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold);
    }
    .hero-tagline-pill {
      display: inline-flex; align-items: center; font-family: var(--font-mono);
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 4px;
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.22); color: rgba(245,197,24,0.95);
    }
    .hero-description {
      font-size: 14px; line-height: 1.68; color: var(--text-secondary); max-width: 550px; margin-bottom: 20px;
    }
    /* Stats */
    .hero-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; max-width: 550px; margin-bottom: 22px; }
    .stat-card {
      background: rgba(13,13,13,0.85); border: 1px solid var(--hairline); border-radius: 4px; padding: 10px 12px;
      backdrop-filter: blur(8px); transition: all 0.4s ease;
    }
    .stat-card:hover { border-color: var(--theme-primary); box-shadow: 0 4px 20px var(--theme-glow); transform: translateY(-2px); }
    .stat-label { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-family: var(--font-display); font-size: 24px; color: white; line-height: 1; }
    .stat-value span { font-size: 14px; color: var(--text-muted); }
    .stat-bar { margin-top: 6px; width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .stat-bar-fill {
      height: 100%; border-radius: 2px; background: var(--theme-primary);
      box-shadow: 0 0 10px var(--theme-glow); transition: width 1.5s cubic-bezier(0.16,1,0.3,1), background 0.8s ease, box-shadow 0.8s ease;
      width: 0;
    }
    .stat-threat { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
    /* CTA Buttons */
    .hero-cta-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
      background: var(--theme-primary); color: white; border: none; border-radius: 4px;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    .btn-primary:hover { filter: brightness(1.2); box-shadow: 0 0 30px var(--theme-glow); transform: scale(1.03) translateY(-2px); }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
      background: rgba(13,13,13,0.8); color: var(--text-secondary); border: 1px solid var(--hairline-bright);
      border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s ease;
    }
    .btn-secondary:hover { border-color: var(--theme-primary); color: white; box-shadow: 0 0 15px var(--theme-glow); }
    .hero-legal { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-top: 14px; }

    /* ═══ 3D POSTER CARD ═══ */
    .hero-visual { position: relative; display: flex; justify-content: center; align-items: center; perspective: 1200px; }
    .poster-3d-wrapper {
      transform-style: preserve-3d; transition: transform 0.08s ease-out;
      will-change: transform;
    }
    .poster-ambient {
      position: absolute; inset: -30px; border-radius: 20px; filter: blur(50px); opacity: 0.5;
      transition: all 1s ease; z-index: -1;
    }
    .poster-card {
      position: relative; width: 100%; max-width: 380px; aspect-ratio: 3/4;
      border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 0 1px rgba(42,42,42,1), 0 20px 60px rgba(0,0,0,0.8), 0 0 40px var(--theme-glow);
      transition: box-shadow 0.5s cubic-bezier(0.16,1,0.3,1), border-color 0.5s ease;
      transform-style: preserve-3d;
    }
    .poster-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: 9px; padding: 1px;
      background: linear-gradient(135deg, var(--theme-primary), transparent 50%, var(--theme-secondary));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.6; pointer-events: none;
      transition: opacity 0.5s ease; z-index: 5;
    }
    .poster-card:hover::before { opacity: 1; }
    .poster-card img {
      width: 100%; height: 100%; object-fit: cover; object-position: center 15%;
      transition: transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .poster-card:hover img { transform: scale(1.04); }
    .poster-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(8,8,8,0.92) 100%); pointer-events: none; z-index: 2; }
    .poster-shine {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 55%, transparent 60%);
      transform: translateX(-100%); transition: transform 0.6s ease;
    }
    .poster-card:hover .poster-shine { transform: translateX(100%); }
    .poster-hud-top {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(8,8,8,0.85) 0%, rgba(8,8,8,0.3) 70%, transparent 100%);
      border-top-left-radius: 8px; border-top-right-radius: 8px;
      z-index: 4;
    }
    .poster-tag {
      font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(255,255,255,0.85);
      background: rgba(13,13,13,0.75); backdrop-filter: blur(10px);
      padding: 4px 8px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.12);
    }
    .poster-status {
      display: flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 3px; background: rgba(13,13,13,0.75); backdrop-filter: blur(10px);
      border: 1px solid; color: var(--theme-secondary);
      transition: all 0.5s ease;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--theme-secondary); animation: pulse-dot 2s ease-in-out infinite; transition: background 0.5s ease; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.7);} }
    .poster-subject {
      position: absolute; bottom: 14px; right: 14px;
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: white;
      background: rgba(8,8,8,0.85); backdrop-filter: blur(10px);
      padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.15);
      z-index: 4;
    }
    .poster-subject i { color: var(--gold); font-size: 9px; }

    /* ═══ CAROUSEL ARROWS ═══ */
    .carousel-arrow {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 50px; height: 50px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px); color: rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50;
      transition: all 0.3s ease;
    }
    .carousel-arrow:hover { border-color: var(--theme-primary); color: white; box-shadow: 0 0 25px var(--theme-glow); background: rgba(0,0,0,0.7); }
    .carousel-arrow.left { left: 20px; }
    .carousel-arrow.right { right: 20px; }

    /* ═══ CHARACTERS GRID ═══ */
    .characters-section { position: relative; z-index: 10; padding: 100px 3rem 80px; }
    .section-header { text-align: center; margin-bottom: 60px; }
    .section-overline { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--crimson); margin-bottom: 12px; }
    .section-title { font-family: var(--font-display); font-size: clamp(36px,5vw,56px); letter-spacing: 0.05em; color: white; text-transform: uppercase; }
    .section-divider { width: 60px; height: 3px; background: var(--crimson); margin: 20px auto 0; border-radius: 2px; box-shadow: 0 0 12px rgba(230,36,41,0.4); }
    .characters-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 24px; max-width: 1440px; margin: 0 auto; }
    .char-card {
      background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 8px;
      overflow: hidden; cursor: pointer; transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
      transform-style: preserve-3d; perspective: 800px;
    }
    .char-card:hover { transform: translateY(-8px) rotateX(2deg); border-color: var(--crimson-hover); box-shadow: 0 0 0 1px #E62429, 0 16px 40px rgba(230,36,41,0.2), 0 4px 12px rgba(230,36,41,0.3); }
    .char-card-img { position: relative; width: 100%; aspect-ratio: 16/10; overflow: hidden; }
    .char-card-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
    .char-card:hover .char-card-img img { transform: scale(1.1); }
    .char-card-img::after { content:''; position: absolute; inset: 0; background: linear-gradient(180deg,transparent 40%,var(--surface-1) 100%); pointer-events: none; }
    .char-card-body { padding: 20px; }
    .char-card-name { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.04em; color: white; text-transform: uppercase; margin-bottom: 4px; }
    .char-card-alias { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
    .char-card-desc { font-size: 13px; line-height: 1.6; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 14px; }
    .char-card-threat {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--crimson); padding: 4px 10px; border-radius: 4px;
      background: rgba(230,36,41,0.08); border: 1px solid rgba(230,36,41,0.2);
    }
    .char-card-threat .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--crimson); animation: pulse-dot 2s ease-in-out infinite; }

    /* ═══ ROSTER DOCK ═══ */
    .roster-dock {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80;
      display: flex; align-items: center; gap: 8px; padding: 8px 14px;
      max-width: min(1180px, calc(100vw - 32px));
      background: rgba(8,8,8,0.88); backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 100px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.65), 0 0 30px var(--theme-glow);
      transition: box-shadow 0.8s ease, bottom 0.3s ease, padding 0.3s ease;
    }
    .dock-label {
      display: flex; flex-direction: column; padding-right: 12px;
      border-right: 1px solid rgba(255,255,255,0.1); margin-right: 2px;
      flex-shrink: 0; user-select: none;
    }
    .dock-label-top { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
    .dock-label-bottom { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    .dock-track {
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      scroll-behavior: smooth; padding: 2px;
    }
    .dock-track::-webkit-scrollbar { display: none; }
    .dock-hero-btn {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      border-radius: 100px; border: 1px solid transparent; background: transparent;
      color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      white-space: nowrap; flex-shrink: 0; outline: none;
    }
    .dock-hero-btn:hover { background: rgba(255,255,255,0.08); color: white; border-color: rgba(255,255,255,0.15); }

// ══════════════════════════════════════════════════════════════════
// THREE.JS 3D PARTICLE SYSTEM
// ══════════════════════════════════════════════════════════════════
function initThreeJS() {
  const canvas = document.getElementById('three-canvas');
  threeRenderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  threeRenderer.setSize(window.innerWidth, window.innerHeight);
  threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  threeScene = new THREE.Scene();
  threeCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  threeCamera.position.z = 50;

  // Create particle geometry
  const particleCount = 800;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 120;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 80;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
    velocities[i * 3] = (Math.random() - 0.5) * 0.02;
    velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.01;
    sizes[i] = Math.random() * 2 + 0.5;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geometry.userData.velocities = velocities;

  // Particle material
  particleMaterial = new THREE.PointsMaterial({
    color: new THREE.Color('#ff4444'),
    size: 0.4,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  particles = new THREE.Points(geometry, particleMaterial);
  threeScene.add(particles);

  // Add floating geometric shapes for depth
  const ringGeo = new THREE.RingGeometry(12, 12.3, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: '#E62429', transparent: true, opacity: 0.08, side: THREE.DoubleSide });
  const ring1 = new THREE.Mesh(ringGeo, ringMat);
  ring1.position.set(15, -5, -20);
  ring1.rotation.x = Math.PI * 0.3;
  threeScene.add(ring1);

  const ring2Geo = new THREE.RingGeometry(18, 18.2, 64);
  const ring2Mat = new THREE.MeshBasicMaterial({ color: '#E62429', transparent: true, opacity: 0.05, side: THREE.DoubleSide });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.position.set(-10, 8, -30);
  ring2.rotation.x = Math.PI * 0.5;
  ring2.rotation.y = Math.PI * 0.2;
  threeScene.add(ring2);

  window.threeRing1 = ring1;
  window.threeRing2 = ring2;
  window.threeRingMat = ringMat;
  window.threeRing2Mat = ring2Mat;

  // Mouse parallax
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);

    // Rotate particles slowly
    particles.rotation.y += 0.0003;
    particles.rotation.x += 0.0001;

    // Animate individual particles
    const pos = particles.geometry.attributes.position.array;
    const vel = particles.geometry.userData.velocities;
    for (let i = 0; i < pos.length; i += 3) {
      pos[i] += vel[i];
      pos[i+1] += vel[i+1];
      pos[i+2] += vel[i+2];
      if (Math.abs(pos[i]) > 60) vel[i] *= -1;
      if (Math.abs(pos[i+1]) > 40) vel[i+1] *= -1;
      if (Math.abs(pos[i+2]) > 30) vel[i+2] *= -1;
    }
    particles.geometry.attributes.position.needsUpdate = true;

    // Rotate rings
    if (window.threeRing1) {
      window.threeRing1.rotation.z += 0.002;
      window.threeRing2.rotation.z -= 0.001;
    }

    // Camera parallax with mouse
    threeCamera.position.x += (mouseX * 3 - threeCamera.position.x) * 0.03;
    threeCamera.position.y += (-mouseY * 2 - threeCamera.position.y) * 0.03;
    threeCamera.lookAt(threeScene.position);

    threeRenderer.render(threeScene, threeCamera);
  }
  animate();

  window.addEventListener('resize', () => {
    threeCamera.aspect = window.innerWidth / window.innerHeight;
    threeCamera.updateProjectionMatrix();
    threeRenderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function updateParticleColor(hexColor) {
  if (particleMaterial) {
    particleMaterial.color.set(hexColor);
  }
  if (window.threeRingMat) {
    window.threeRingMat.color.set(hexColor);
    window.threeRing2Mat.color.set(hexColor);
  }
}

// ══════════════════════════════════════════════════════════════════
// 3D CARD TILT EFFECT
// ══════════════════════════════════════════════════════════════════
function init3DCardTilt() {
  const wrapper = document.getElementById('poster3dWrapper');
  const card = document.getElementById('posterCard');
  if (!wrapper || !card) return;

  let currentRx = 0, currentRy = 0, currentScale = 1;
  let targetRx = 0, targetRy = 0, targetScale = 1;
  let animId = null;

  function renderTilt() {
    currentRx += (targetRx - currentRx) * 0.12;
    currentRy += (targetRy - currentRy) * 0.12;
    currentScale += (targetScale - currentScale) * 0.12;

    wrapper.style.transform = `perspective(1000px) rotateX(${currentRx.toFixed(2)}deg) rotateY(${currentRy.toFixed(2)}deg) scale3d(${currentScale.toFixed(3)},${currentScale.toFixed(3)},${currentScale.toFixed(3)})`;

    const delta = Math.abs(targetRx - currentRx) + Math.abs(targetRy - currentRy) + Math.abs(targetScale - currentScale);
    if (delta > 0.01) {
      animId = requestAnimationFrame(renderTilt);
    } else {
      animId = null;
    }
  }

  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    targetRx = ((y - centerY) / centerY) * -10;
    targetRy = ((x - centerX) / centerX) * 10;
    targetScale = 1.03;

    if (!animId) {
      animId = requestAnimationFrame(renderTilt);
    }
  });

  card.addEventListener('mouseleave', () => {
    targetRx = 0;
    targetRy = 0;
    targetScale = 1;
    if (!animId) {
      animId = requestAnimationFrame(renderTilt);
    }
  });
}

  if (isTransitioning) return;
  if (index < 0) index = heroes.length - 1;
  if (index >= heroes.length) index = 0;
  isTransitioning = true;
  currentHeroIndex = index;
  const hero = heroes[index];

  const content = document.getElementById('heroContent');
  const visual = document.getElementById('heroVisual');

  // Fade out
  content.classList.remove('fade-in');
  content.classList.add('fade-out');
  visual.classList.remove('fade-in');
  visual.classList.add('fade-out');

  // Update background immediately for smooth transition
  updateBackground(hero);

  setTimeout(() => {
    // Update all hero content
    document.getElementById('heroTitle').textContent = hero.name;
    document.getElementById('heroRealName').textContent = hero.realName;
    document.getElementById('heroBadge').textContent = hero.badge;
    document.getElementById('heroTagline').textContent = hero.tagline;
    document.getElementById('heroDescription').textContent = hero.description;
    document.getElementById('heroThreat').textContent = hero.threat;
    document.getElementById('stat1Label').textContent = hero.stat1.label;
    document.getElementById('stat1Value').innerHTML = `${hero.stat1.value} <span>/ 100</span>`;
    document.getElementById('stat1Bar').style.width = hero.stat1.value + '%';
    document.getElementById('stat2Label').textContent = hero.stat2.label;
    document.getElementById('stat2Value').innerHTML = `${hero.stat2.value} <span>/ 100</span>`;
    document.getElementById('stat2Bar').style.width = hero.stat2.value + '%';
    document.getElementById('ctaPrimaryText').textContent = hero.ctaPrimary;
    document.getElementById('ctaSecondaryText').textContent = hero.ctaSecondary;
    document.getElementById('heroLegal').textContent = hero.legal;
    document.getElementById('heroImage').src = hero.image;
    document.getElementById('heroImage').alt = hero.name;
    document.getElementById('posterTag').textContent = hero.posterTag;
    document.getElementById('posterSubject').innerHTML = `<i class="fa-solid fa-crosshairs"></i> ${hero.posterSubject}`;
    document.getElementById('navHashtag').textContent = hero.hashtag;

    // Update title text shadow
    document.getElementById('heroTitle').style.textShadow = `0 10px 40px rgba(0,0,0,0.6), 0 0 30px ${hero.theme.glow}`;

    // Update dock active state & accessibility
    document.querySelectorAll('.dock-hero-btn').forEach((btn, i) => {
      const isActive = i === index;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      btn.setAttribute('tabindex', isActive ? '0' : '-1');
      if (isActive) {
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    });

    // Fade in
    content.classList.remove('fade-out');
    content.classList.add('fade-in');
    visual.classList.remove('fade-out');
    visual.classList.add('fade-in');

    isTransitioning = false;
  }, 450);
}

// ══════════════════════════════════════════════════════════════════
// BUILD UI ELEMENTS
// ══════════════════════════════════════════════════════════════════
function buildDock() {
  const track = document.getElementById('dockTrack');
  if (!track) return;
  track.innerHTML = '';
  heroes.forEach((hero, i) => {
    const btn = document.createElement('button');
    btn.className = `dock-hero-btn ${i === 0 ? 'active' : ''}`;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', `Select ${hero.name}`);
    btn.setAttribute('tabindex', i === 0 ? '0' : '-1');
    btn.onclick = () => switchHero(i);
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        const nextIdx = (i + 1) % heroes.length;
        switchHero(nextIdx);
        document.querySelectorAll('.dock-hero-btn')[nextIdx]?.focus();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        const prevIdx = (i - 1 + heroes.length) % heroes.length;
        switchHero(prevIdx);
        document.querySelectorAll('.dock-hero-btn')[prevIdx]?.focus();
      }
    });
    const dockDisplayNames = {
      ironman: 'IRON MAN',
      spiderman: 'SPIDER-MAN',
      thor: 'THOR',
      hulk: 'HULK',
      captain: 'CAPT. AMERICA',
      strange: 'DR. STRANGE',
      wolverine: 'WOLVERINE'
    };
    const shortName = dockDisplayNames[hero.id] || hero.name;
    btn.innerHTML = `
      <div class="dock-hero-icon"><img src="${hero.image}" alt="" aria-hidden="true"/></div>
      <div class="dock-hero-text">
        <span class="dock-hero-name">${shortName}</span>
        <span class="dock-hero-tag">${hero.hashtag}</span>
      </div>`;
    track.appendChild(btn);
  });
}

function buildCharactersGrid() {
  const grid = document.getElementById('charactersGrid');
  heroes.forEach((hero, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.style.opacity = '0';
    card.style.transform = 'translateY(30px)';
    card.style.transition = `all 0.6s cubic-bezier(0.16,1,0.3,1) ${i * 0.08}s`;
    card.onclick = () => {
      switchHero(i);
      document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
    };
    card.innerHTML = `
      <div class="char-card-img"><img src="${hero.image}" alt="${hero.name}" loading="lazy"/></div>
      <div class="char-card-body">
        <div class="char-card-name">${hero.name}</div>
        <div class="char-card-alias">${hero.realName}</div>
        <div class="char-card-desc">${hero.description}</div>
        <div class="char-card-threat"><span class="pulse"></span>${hero.threat}</div>
      </div>`;
    grid.appendChild(card);
  });

  // Observe cards for scroll reveal
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.char-card').forEach(c => observer.observe(c));
}

// ══════════════════════════════════════════════════════════════════
// INITIALIZATION
// ══════════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  // Init Three.js 3D immediately
  initThreeJS();
  init3DCardTilt();

  // Fetch hero data from backend API asynchronously
  fetchHeroes().catch(console.warn);

  // Build UI
  buildDock();
  buildCharactersGrid();

  // Load initial hero (supports #captain, #captainamerica, or defaults to first hero)
  if (heroes.length > 0) {
    const rawHash = (window.location.hash || '').replace('#', '').toLowerCase();
    const hashIndex = heroes.findIndex(hero => hero.id === rawHash || hero.hashtag.toLowerCase().replace('#', '') === rawHash);
    if (hashIndex !== -1) {
      currentHeroIndex = hashIndex;
      document.querySelectorAll('.dock-hero-btn').forEach((btn, i) => {
        const isActive = i === currentHeroIndex;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        btn.setAttribute('tabindex', isActive ? '0' : '-1');
      });
    }
    const h = heroes[currentHeroIndex];
    document.getElementById('heroTitle').textContent = h.name;
    document.getElementById('heroRealName').textContent = h.realName;
    document.getElementById('heroBadge').textContent = h.badge;
    document.getElementById('heroTagline').textContent = h.tagline;
    document.getElementById('heroDescription').textContent = h.description;
    document.getElementById('heroThreat').textContent = h.threat;
    document.getElementById('stat1Label').textContent = h.stat1.label;
    document.getElementById('stat1Value').innerHTML = `${h.stat1.value} <span>/ 100</span>`;
    document.getElementById('stat2Label').textContent = h.stat2.label;
    document.getElementById('stat2Value').innerHTML = `${h.stat2.value} <span>/ 100</span>`;
    document.getElementById('ctaPrimaryText').textContent = h.ctaPrimary;
    document.getElementById('ctaSecondaryText').textContent = h.ctaSecondary;
    document.getElementById('heroLegal').textContent = h.legal;
    document.getElementById('heroImage').src = h.image;
    document.getElementById('heroImage').alt = h.name;
    document.getElementById('posterTag').textContent = h.posterTag;
    document.getElementById('posterSubject').innerHTML = `<i class="fa-solid fa-crosshairs"></i> ${h.posterSubject}`;
    document.getElementById('navHashtag').textContent = h.hashtag;

    // Apply initial theme
    updateBackground(h);

    // Animate stat bars after a delay
    setTimeout(() => {
      document.getElementById('stat1Bar').style.width = h.stat1.value + '%';
      document.getElementById('stat2Bar').style.width = h.stat2.value + '%';
    }, 500);
  }

  // Nav scroll effect
  window.addEventListener('scroll', () => {
    document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 40);
  });

  // Carousel arrows
  document.getElementById('prevHero').addEventListener('click', () => switchHero(currentHeroIndex - 1));
  document.getElementById('nextHero').addEventListener('click', () => switchHero(currentHeroIndex + 1));

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') switchHero(currentHeroIndex + 1);
    if (e.key === 'ArrowLeft') switchHero(currentHeroIndex - 1);
  });

  // Touch swipe support (respects dock touch scrolling)
  let touchStartX = 0;
  let touchStartY = 0;
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('#rosterDock')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (e.target.closest('#rosterDock')) return;
    const diffX = touchStartX - e.changedTouches[0].clientX;
    const diffY = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 0) switchHero(currentHeroIndex + 1);
      else switchHero(currentHeroIndex - 1);
    }
  }, { passive: true });

  // Hide loading screen
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 2400);

  // Auto-rotate
  setInterval(() => { switchHero(currentHeroIndex + 1); }, 14000);
});
</script>
